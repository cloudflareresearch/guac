[package]
name = "guac"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "MOLE endorsement and credential flows"
license = "Apache-2.0"
repository = "https://github.com/cloudflareresearch/guac"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[workspace]
members = ["cli"]
default-members = ["."]
resolver = "3"

[features]
browser = ["act/wasm_js", "ec_ihat/wasm_js", "getrandom/wasm_js", "dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
act = { package = "ec-act", git = "https://github.com/Moderation-of-unLinkable-Endorsements/mole-p256-rs", rev = "7b7aca7cdef11dc558c089b8345ffe51a81554c9" }
ec_ihat = { package = "ec-ihat", git = "https://github.com/Moderation-of-unLinkable-Endorsements/mole-p256-rs", rev = "7b7aca7cdef11dc558c089b8345ffe51a81554c9" }
base64 = "0.23"
getrandom = "0.4"
http-auth = { version = "0.1.10", default-features = false }
sha2 = "0.11"
thiserror = "2"
url = "2"
zeroize = { version = "1", features = ["alloc"] }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true, default-features = false }
hmac = "0.13"

[dev-dependencies]
hex = "0.4"
proptest = { version = "1.11", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--flexible-inline-max-function-size", "128"]
